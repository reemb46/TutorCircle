<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – TutorCircle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="auth">
    <div class="card">
      <div class="brand">TutorCircle</div>

      <div class="tabs">
        <button type="button" class="tab active" data-tab="login">Log in</button>
        <button type="button" class="tab" data-tab="signup">Sign up</button>
      </div>

      <form id="login" data-next="find-sessions.html">
        <label for="login-email">University email</label>
        <input type="email" id="login-email" placeholder="name@aubh.edu.bh" required>

        <label for="login-password">Password</label>
        <input type="password" id="login-password" required>

        <button class="btn block">Log in</button>

        <div class="demo">
          <strong>Demo:</strong> open the site as each role.<br>
          <a href="find-sessions.html">Student</a>
          <a href="my-sessions.html">Peer tutor</a>
          <a href="coordinator-dashboard.html">Coordinator</a>
          <a href="admin-users.html">Admin</a>
        </div>
      </form>

      <form id="signup" class="hidden" data-next="find-sessions.html" data-next-tutor="my-profile.html">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Your name" required>

        <label for="email">University email</label>
        <input type="email" id="email" placeholder="name@aubh.edu.bh" required>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <label>Join as</label>
        <label class="option"><input type="radio" name="role" value="learner" checked> Learner</label>
        <label class="option"><input type="radio" name="role" value="tutor"> Peer tutor</label>

        <button class="btn block">Create account</button>
        <p class="muted">Tutors are approved by a coordinator before they can teach. Coordinator and admin accounts are created by an admin.</p>
      </form>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
