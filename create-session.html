<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create a session – TutorCircle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">TutorCircle</div>
      <div class="role">Peer tutor</div>
      <nav>
        <a href="my-sessions.html">My sessions</a>
        <a href="create-session.html" class="active">Create session</a>
        <a href="my-profile.html">My profile</a>
      </nav>
      <div class="sidebar-foot">
        <strong>Tutor name</strong><br>
        <a href="index.html">Log out</a>
      </div>
    </aside>

    <main class="main">
      <h1>Create a session</h1>

      <form class="card" style="max-width: 790px" data-next="tutor-session.html">
        <label for="title" style="margin-top: 0">Title</label>
        <input type="text" id="title" placeholder="e.g. UML Sequence Diagrams" required>

        <div class="row">
          <div>
            <label for="subject">Subject</label>
            <select id="subject"><option>SWEN 360</option><option>Databases</option><option>Programming</option></select>
          </div>
          <div>
            <label for="topic">Topic</label>
            <select id="topic"><option>UML diagrams</option><option>Use cases</option><option>Agile</option><option>SQL</option><option>Recursion</option></select>
          </div>
        </div>

        <label>Type</label>
        <label class="option"><input type="radio" name="type" value="individual"> Individual</label>
        <label class="option"><input type="radio" name="type" value="group" checked> Group</label>

        <label for="objectives">Objectives</label>
        <textarea id="objectives" rows="3" placeholder="What will learners be able to do?" required></textarea>

        <div class="row">
          <div>
            <label for="date">Date and time</label>
            <input type="datetime-local" id="date" required>
          </div>
          <div>
            <label for="duration">Duration</label>
            <select id="duration"><option>30 min</option><option selected>60 min</option><option>90 min</option></select>
          </div>
          <div>
            <label for="capacity">Capacity</label>
            <input type="number" id="capacity" value="6" min="1" required>
          </div>
        </div>

        <label for="location">Location or meeting link</label>
        <input type="text" id="location" placeholder="Room S-204 or https://…" required>
        <p class="muted">Only students who booked can see the location or link.</p>

        <div class="right"><button class="btn">Publish session</button></div>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
